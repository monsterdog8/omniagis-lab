name: UMP-001 child selftest
on:
  push:
    branches:
      - ump-001-gtab-bind-001
    paths:
      - "experiments/ump-001/**"
      - ".github/workflows/ump-001-child-selftest.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Checkout child branch
      - uses: actions/setup-python@v5
        name: Setup Python
        with:
          python-version: "3.13"
      - name: Verify immutable Stage0 receipt binding
        shell: bash
        run: |
          set -euo pipefail
          grep -F "CAPSULE_SHA256=3d000c5ec1ec27d1fde68fa528ac25e9d5c34b698e3cc7f684682cf180f3057c" experiments/ump-001/UMP_001_STAGE0_EXTERNAL_HASH_RECEIPT.txt
      - name: Run all RC3 software selftests
        run: python -m unittest discover -s experiments/ump-001/tests -p "test*.py" -v
      - name: Validate patch-forward child invariants
        run: python experiments/ump-001/validate_ump_child.py
      - name: Run BERZERKER structural CH scanner
        shell: bash
        run: |
          set -euo pipefail
          python experiments/ump-001/ump_rc3_ch_scanner.py > /tmp/ch.json
          grep -F '"aggregate_pass": "FORBIDDEN"' /tmp/ch.json
          grep -F '"executed_structural": 3' /tmp/ch.json
      - name: Verify reality runner remains fail-closed without hardware
        shell: bash
        run: |
          set -euo pipefail
          python experiments/ump-001/ump_rc3_runner.py > /tmp/preflight.json
          grep -F '"status": "BLOCKED_REQUIRED_MEASUREMENT"' /tmp/preflight.json
          grep -F '"GTAB_REAL": "NOT_BOUND"' /tmp/preflight.json
      - name: Verify power planner remains fail-closed without pilot data
        shell: bash
        run: |
          set -euo pipefail
          python experiments/ump-001/ump_rc3_power_plan.py > /tmp/power.json
          grep -F '"status": "BLOCKED_MISSING_PILOT_SD_AND_EPSILON"' /tmp/power.json
          grep -F '"canonical_confirmatory_N": "NOT_COMPUTED"' /tmp/power.json
      - name: Compute detached canonical child SHA256 manifest
        shell: bash
        run: |
          set -euo pipefail
          find experiments/ump-001 -type f \
            ! -name 'UMP_001_RC3_SHA256SUMS.txt' \
            ! -name '*.pyc' \
            ! -path '*/__pycache__/*' \
            -print0 | sort -z | xargs -0 sha256sum | tee /tmp/UMP_001_RC3_SHA256SUMS.txt
      - name: Verify sealed child SHA256 manifest when present
        shell: bash
        run: |
          set -euo pipefail
          if test -f experiments/ump-001/UMP_001_RC3_SHA256SUMS.txt; then
            sha256sum -c experiments/ump-001/UMP_001_RC3_SHA256SUMS.txt
          else
            echo "SHA256_MANIFEST=NOT_YET_SEALED"
          fi
