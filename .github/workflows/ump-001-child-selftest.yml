name: UMP-001 child selftest
on:
  push:
    branches:
      - ump-001-stage0-freeze
    paths:
      - "experiments/ump-001/**"
      - ".github/workflows/ump-001-child-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify Stage0 parent receipt unchanged
        shell: bash
        run: |
          set -euo pipefail
          test -f experiments/ump-001/UMP_001_STAGE0_EXTERNAL_HASH_RECEIPT.txt
          grep -F "CAPSULE_SHA256=3d000c5ec1ec27d1fde68fa528ac25e9d5c34b698e3cc7f684682cf180f3057c" experiments/ump-001/UMP_001_STAGE0_EXTERNAL_HASH_RECEIPT.txt
      - name: Run child selftests
        run: python -m unittest -v experiments.ump-001.tests.test_ump_rc3_core
