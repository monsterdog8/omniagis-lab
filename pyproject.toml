[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniagis"
version = "0.1.0"
description = "Fail-closed scientific validation framework for dynamical systems using return-time statistics and ε-robustness"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24.0"]

[project.scripts]
omniagis = "omniagis.cli:main"
gpts-ultimate = "gpts_ultimate.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=omniagis --cov=gpts_core --cov=phase_omega --cov=gpts_ultimate --cov-fail-under=80"

[tool.coverage.run]
source = ["omniagis", "gpts_core", "phase_omega", "gpts_ultimate"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
]

[tool.setuptools.packages.find]
where = [".", "src"]

[tool.setuptools.package-dir]
"" = "."
